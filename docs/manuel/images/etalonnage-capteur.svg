<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="400" rx="18" fill="#15171c"/>
  <text x="200" y="36" fill="#e8e6ff" font-size="18" text-anchor="middle">1. Étalonnage (une fois)</text>
  <text x="610" y="36" fill="#e8e6ff" font-size="18" text-anchor="middle">2. Mesure de chaque outil</text>
  <!-- ligne de référence -->
  <line x1="150" y1="80" x2="760" y2="80" stroke="#b9b4ff" stroke-dasharray="6 5"/>
  <text x="262" y="72" fill="#b9b4ff" font-size="13">Z de référence (pige au contact)</text>
  <!-- gauche : pige -->
  <rect x="150" y="80" width="100" height="70" rx="8" fill="#3a3f4b"/>
  <polygon points="165,150 235,150 228,180 172,180" fill="#6b63ff"/>
  <rect x="192" y="180" width="16" height="120" fill="#9aa0ad"/>
  <rect x="140" y="300" width="120" height="30" rx="5" fill="#34a870"/>
  <text x="200" y="352" fill="#9fe0bf" font-size="14" text-anchor="middle">Capteur d’outil</text>
  <text x="180" y="236" fill="#e8e6ff" font-size="14" text-anchor="end">Pige de longueur</text>
  <text x="180" y="254" fill="#e8e6ff" font-size="14" text-anchor="end">connue L</text>
  <!-- droite : outil plus long, broche plus haute -->
  <rect x="560" y="52" width="100" height="70" rx="8" fill="#3a3f4b"/>
  <polygon points="575,122 645,122 638,152 582,152" fill="#6b63ff"/>
  <rect x="602" y="152" width="16" height="148" fill="#fa8c52"/>
  <rect x="550" y="300" width="120" height="30" rx="5" fill="#34a870"/>
  <line x1="540" y1="52" x2="540" y2="80" stroke="#fa8c52" stroke-width="2"/>
  <line x1="532" y1="52" x2="548" y2="52" stroke="#fa8c52" stroke-width="2"/>
  <text x="528" y="70" fill="#fa8c52" font-size="14" text-anchor="end">écart de Z</text>
  <text x="680" y="200" fill="#fa8c52" font-size="14">outil installé</text>
  <text x="410" y="385" fill="#e8e6ff" font-size="16" text-anchor="middle">Longueur réelle = L + (Z au contact − Z de référence)</text>
</svg>
