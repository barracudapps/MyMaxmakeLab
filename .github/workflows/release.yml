# Production release: pushing a tag vX.Y.Z (no suffix) builds the app
# for macOS (universal), Linux and Windows, and publishes a GitHub
# release. Installed copies update themselves from it.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo test --workspace --release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: MyMaxmakeLab-macos-universal.zip
          - os: ubuntu-24.04
            asset: MyMaxmakeLab-linux-x86_64.tar.gz
          - os: windows-2022
            asset: MyMaxmakeLab-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The binary compares this version with the latest release.
          perl -0pi -e "s/(\[workspace\.package\]\nversion = )\"[^\"]*\"/\$1\"$version\"/" Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libwayland-dev libgtk-3-dev
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p mml_app -p mml_mcp --target aarch64-apple-darwin
          cargo build --release -p mml_app -p mml_mcp --target x86_64-apple-darwin
          mkdir dist
          scripts/bundle-macos.sh "$VERSION" dist \
            target/aarch64-apple-darwin/release \
            target/x86_64-apple-darwin/release
          (cd dist && ditto -c -k --keepParent MyMaxmakeLab.app ../${{ matrix.asset }})
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p mml_app -p mml_mcp
          tar -czf ${{ matrix.asset }} -C target/release mymaxmakelab mymaxmakelab-mcp
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p mml_app -p mml_mcp
          Compress-Archive -Path target/release/mymaxmakelab.exe,target/release/mymaxmakelab-mcp.exe -DestinationPath ${{ matrix.asset }}
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          generate_release_notes: true
