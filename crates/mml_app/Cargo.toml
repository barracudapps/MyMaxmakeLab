[package]
name = "mml_app"
description = "MyMaxmakeLab desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "mymaxmakelab"
path = "src/main.rs"

[dependencies]
mml_core.workspace = true
mml_cnc.workspace = true
mml_gcode.workspace = true
mml_job.workspace = true
mml_io.workspace = true
mml_materials.workspace = true
mml_device.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
directories = "6"
sha2 = "0.10"
sys-locale = "0.3"
mml_probe = { version = "0.1.0", path = "../mml_probe" }
mml_relief = { version = "0.1.0", path = "../mml_relief" }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }
